name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-latest
            platform: linux
            java-arch: x64
            gradle-command: ./gradlew build
            artifact-name: jthorvg-linux-amd64
          - name: Windows amd64
            os: windows-latest
            platform: windows
            java-arch: x64
            gradle-command: .\gradlew.bat build
            artifact-name: jthorvg-windows-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: ${{ matrix.java-arch }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: ${{ matrix.java-arch }}

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Build library
        run: ${{ matrix.gradle-command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            lib/build/libs/*
            lib/build/native/${{ matrix.platform }}/*
